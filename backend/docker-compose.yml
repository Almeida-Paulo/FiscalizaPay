services:
  db:
    image: postgres:16-alpine
    container_name: fiscalizapay-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fiscalizapay
      POSTGRES_USER: fiscalizapay
      POSTGRES_PASSWORD: fiscalizapay_dev_password
    volumes:
      - fiscalizapay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiscalizapay -d fiscalizapay"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: fiscalizapay-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-8000}:${PORT:-8000}"
    command: >
      sh -c "alembic upgrade head &&
             gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:${PORT:-8000}"

volumes:
  fiscalizapay_postgres_data:
